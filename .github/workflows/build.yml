name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write   # 发布 Release 需要
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log || {
            grep -E "error:|AAPT|What went wrong|Execution failed|Caused by" -A3 build.log | head -60 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Liubai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # 推到 main 时发布一个 Release：App 里的“自动更新”靠它找最新版本（标签 v1.0.<构建号>，APK 固定叫 Liubai.apk）
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Liubai.apk
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" Liubai.apk \
            --title "留白 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "${NOTES:-自动构建}" \
            --target "${GITHUB_SHA}" \
            --latest
