plugins {
    id 'com.android.application'
}

android {
    namespace 'com.liubai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.liubai.app"
        minSdk 26
        targetSdk 34
        // 每次构建版本号递增，保证新版本总能覆盖旧版本
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // 固定的调试签名：每次构建签名一致，才能覆盖安装
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        aidl true   // Shizuku 用户服务的接口 IShellService.aidl
    }
}

dependencies {
    // 可选的“精确识别播放”：Shizuku 没装 / 没运行时自动退回媒体会话和系统音频
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
